<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGB Gæt — Farvehistorik</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f2efe8;
    --ink: #1a1a18;
    --muted: #9a9890;
    --border: #d8d4cc;
    --card: #ffffff;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.5;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  /* Header */
  header {
    margin-bottom: 56px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 32px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  h1 {
    font-size: clamp(36px, 7vw, 60px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .header-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-align: right;
  }

  .header-meta span {
    display: block;
    margin-top: 4px;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 24px;
    margin-bottom: 32px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 2px;
  }

  .legend-swatch.target {
    background: var(--ink);
  }

  .legend-swatch.guess {
    background: var(--ink);
    opacity: 0.3;
    outline: 1px dashed var(--muted);
    outline-offset: 2px;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }

  /* Card */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 12px;
    opacity: 0;
    transform: translateY(10px);
    animation: up 0.35s forwards;
  }

  @keyframes up {
    to { opacity: 1; transform: none; }
  }

  .swatches {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
  }

  .swatch {
    flex: 1;
    height: 64px;
    border-radius: 2px;
  }

  .swatch.target {
    /* color set inline */
  }

  .swatch.guess {
    /* color set inline */
    position: relative;
  }

  /* Deviation badge */
  .dev {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    font-weight: 400;
    line-height: 1;
    color: var(--ink);
  }

  .dev-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* Deviation color — green når tæt, rød når langt */
  .dev.close { color: #2a7a4a; }
  .dev.mid   { color: #a06020; }
  .dev.far   { color: #b03030; }

  /* Timestamp */
  .ts {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.05em;
  }

  /* Empty state */
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 0;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 64px 0;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .dot {
    display: inline-block;
    animation: blink 1s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 100% { opacity: 0.2; }
    50%       { opacity: 1; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>Farve<br>historik</h1>
    <div class="header-meta">
      RGB Gæt-spil
      <span id="round-count">— runder</span>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch target"></div>
      <span>Target</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch guess"></div>
      <span>Gæt</span>
    </div>
  </div>

  <div class="grid" id="grid">
    <div class="loading">
      Henter<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL = 'https://qdhcbcmtmawyxwubetpe.supabase.co';
  const ANON_KEY     = 'din_anon_key_her';

  function hexInt(n) {
    if (n == null) return null;
    const r = (n >> 16) & 0xFF;
    const g = (n >> 8)  & 0xFF;
    const b =  n        & 0xFF;
    return `rgb(${r},${g},${b})`;
  }

  function devClass(d) {
    if (d <= 30)  return 'close';
    if (d <= 100) return 'mid';
    return 'far';
  }

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' })
      + ' ' + d.toLocaleDateString('da-DK', { day: 'numeric', month: 'short' });
  }

  async function load() {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/rounds?select=target_color,guess_color,deviation,created_at&order=created_at.desc&limit=60`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } }
    );
    const rows = await res.json();
    const grid = document.getElementById('grid');

    document.getElementById('round-count').textContent =
      rows.length + ' runde' + (rows.length === 1 ? '' : 'r');

    if (!rows.length) {
      grid.innerHTML = '<div class="empty">Ingen runder endnu</div>';
      return;
    }

    grid.innerHTML = rows.map((r, i) => {
      const tc = hexInt(r.target_color);
      const gc = hexInt(r.guess_color);
      const d  = r.deviation ?? '?';
      const dc = typeof d === 'number' ? devClass(d) : '';
      return `
        <div class="card" style="animation-delay:${i * 30}ms">
          <div class="swatches">
            <div class="swatch target" style="background:${tc ?? '#ccc'}"></div>
            <div class="swatch guess"  style="background:${gc ?? '#ccc'}"></div>
          </div>
          <div class="dev ${dc}">${d}</div>
          <div class="dev-label">afvigelse</div>
          <div class="ts">${formatTime(r.created_at)}</div>
        </div>`;
    }).join('');
  }

  load().catch(() => {
    document.getElementById('grid').innerHTML =
      '<div class="empty">Kunne ikke hente data</div>';
  });
</script>
</body>
</html>
